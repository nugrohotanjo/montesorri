<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Montessori Playroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FAF7F2;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .safe-top { padding-top: env(safe-area-inset-top, 1rem); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 1.5rem); }
    </style>

    <!-- Kunci mode fullscreen standalone di iOS/iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montessori" />

    <!-- Cegah zoom yang tidak disengaja oleh anak -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  </head>
  <body class="min-h-screen text-stone-800 safe-top safe-bottom">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
